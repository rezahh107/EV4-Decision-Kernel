continuation_profile:
  profile_id: EV4-PCVP-PROFILE-PROJECT-GATE
  profile_version: 1.0.0
  profile_status: release_candidate
  policy_id: EV4-PCVP
  policy_version: 1.0.0
  repository: rezahh107/EV4-Project-Gate
  stage_id: PROJECT_GATE
  consumes_from:
  - ARCHITECT
  - CONSTRUCTABILITY_ENGINEER
  - BUILDER_ASSISTANT
  - RESPONSIVE_ARCHITECT
  produces_for:
  - OWNER_FINAL_DECISION
  preauthorized_effects:
  - effect_class: REASONING_ONLY
    bounded_output_types:
    - gate_analysis
    - verification_gap_summary
    - reconciliation_scope
    scope: analysis and owner guidance only
  - effect_class: DRAFT_ONLY
    bounded_output_types:
    - provisional_gate_report
    scope: non-authoritative draft; no official PASS
  safe_reversible_default_enabled: true
  safe_reversible_default_effect_classes:
  - REASONING_ONLY
  - DRAFT_ONLY
  verified_only_boundaries:
  - official gate PASS
  - merge-ready claim
  - release-ready claim
  - production-ready claim
  - exact-head CI verification
  upstream_supplement_request_format: one bounded request to the first affected upstream
    stage
  new_blocker_examples:
  - new critical contradiction in an upstream dependency
  - exact-head identity changes
  - owner requests an irreversible action
  non_blocker_examples:
  - same known verification gap already carried
  - unrelated unverified informational claim
  owner_facing_language: fa
